spring.application.name=selenly

# Local development: bootRun starts the services from infra/compose.dev.yml
# (PostgreSQL, Keycloak, Mailpit) and stops them when the application exits.
# The path is relative to the working directory of bootRun, which is backend/.
# Only used when spring-boot-docker-compose is on the classpath (developmentOnly),
# so it has no effect in tests or in the production image.
spring.docker.compose.file=../infra/compose.dev.yml

# Flyway applies src/main/resources/db/migration on every start.
# Fail on a badly named migration file (e.g. one underscore instead of two)
# instead of silently skipping it.
spring.flyway.validate-migration-naming=true
