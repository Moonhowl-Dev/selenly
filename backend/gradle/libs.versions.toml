# Version catalog: the single place for the versions we choose.
# https://docs.gradle.org/current/userguide/version_catalogs.html
#
# Rule: every version number lives here. Spring starters have no entry, because
# their versions come from the Spring Boot and Spring Modulith BOMs.
# Libraries that need an explicit version get a [libraries] entry.

[versions]
spring-boot = "4.1.1"
spring-dependency-management = "1.1.7"
spring-modulith = "2.1.1"
spotless = "8.10.4"
palantir-java-format = "2.102.0"
errorprone-gradle-plugin = "5.1.1"
error-prone = "2.51.0"
nullaway = "0.14.3"

[libraries]
error-prone-core = { module = "com.google.errorprone:error_prone_core", version.ref = "error-prone" }
nullaway = { module = "com.uber.nullaway:nullaway", version.ref = "nullaway" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "spring-dependency-management" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
errorprone = { id = "net.ltgt.errorprone", version.ref = "errorprone-gradle-plugin" }
