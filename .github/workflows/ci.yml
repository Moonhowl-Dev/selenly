# Checks every pull request and every push to main with the same commands you run locally.
# The ruleset in .github/rulesets/main.json requires both jobs to pass before a merge.
#
# Every action is pinned to a full commit SHA (a tag can be moved to other code, a SHA cannot).
# The comment after the SHA says which release it is.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# The token of these jobs can only read the repository.
permissions:
  contents: read

# A new push to the same pull request cancels the run that is still in progress.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java (version from .sdkmanrc)
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version-file: .sdkmanrc

      # Caches Gradle and validates the Gradle wrapper (gradle-wrapper.jar) before running it.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      # Formatting, Error Prone with NullAway, module boundaries and all tests.
      # Tests start PostgreSQL in Docker (Testcontainers); GitHub's Ubuntu runners have Docker.
      - name: Check
        run: ./gradlew check

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-test-reports
          path: backend/build/reports/tests/
          retention-days: 7

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm (version from packageManager in package.json)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json

      - name: Set up Node (version from .node-version)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint (ESLint and Prettier)
        run: pnpm lint

      # Also fails when a new route was added without its regenerated routeTree.gen.ts.
      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
